services:
  finance-db:
    image: postgres:16-alpine
    container_name: finance-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - finance-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-finance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finance}
      POSTGRES_DB: ${DB_NAME:-finance}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finance} -d ${DB_NAME:-finance}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - finance-network

  finance-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: finance-api:latest
    container_name: finance-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      finance-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://finance-db:5432/${DB_NAME:-finance}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-finance}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-finance}
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      JAVA_OPTS: "-Xms256M -Xmx512M -XX:+UseSerialGC"
    networks:
      - finance-network

networks:
  finance-network:
    driver: bridge

volumes:
  finance-db-data:
